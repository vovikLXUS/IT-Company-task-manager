{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
<div class="card shadow-sm p-4 col-md-7 col-lg-5 mx-auto my-4">
  <div class="text-center mb-3">
    <div class="fs-1 text-primary mb-2">
      <i class="bi bi-kanban-fill"></i>
    </div>
    <h1>Login</h1>
  </div>

  {% if form.errors %}
    <div class="alert alert-danger py-2 small" role="alert">
      <i class="bi bi-exclamation-circle me-1"></i> Your username and password didn't match. Please try again.
    </div>
  {% endif %}

  {% if next %}
    <div class="alert alert-info py-2 small" role="alert">
      <i class="bi bi-info-circle me-1"></i> Please login to see this page.
    </div>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form|crispy }}

    <div class="mt-3">
      <input type="submit" value="Login" class="btn btn-primary w-100 py-2 fw-semibold" />
    </div>
    <input type="hidden" name="next" value="{{ next }}" />
  </form>
</div>
{% endblock %}
