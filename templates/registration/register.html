{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
<div class="card shadow-sm p-4 col-md-7 col-lg-5 mx-auto my-4">
  <div class="text-center mb-3">
    <div class="fs-1 text-primary mb-2">
      <i class="bi bi-person-plus-fill"></i>
    </div>
    <h1>Register</h1>
    <p class="text-muted small">Create your account to start managing tasks</p>
  </div>

  <form method="post" action="">
    {% csrf_token %}
    {{ form|crispy }}

    <div class="mt-4 pt-2">
      <input type="submit" value="Register" class="btn btn-primary w-100 py-2 fw-semibold" />
    </div>
  </form>

  <div class="text-center mt-3 pt-3 border-top">
    <p class="text-muted small mb-0">
      Already have an account?
      <a href="{% url 'login' %}" class="fw-semibold text-decoration-none">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
