{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm p-4 col-md-6 mx-auto my-4 text-center">
  <div class="mb-3 text-danger fs-1">
    <i class="bi bi-exclamation-triangle-fill"></i>
  </div>
  <h1 class="h3 justify-content-center">Delete task: {{ task.name }}?</h1>
  <p class="text-muted">Are you sure you want to delete this task? This action cannot be undone.</p>
  <form action="" method="post" class="mt-3">
    {% csrf_token %}

    <input type="submit" value="Yes, delete" class="btn btn-danger px-4">
    <a href="{% url 'tasks:task-list' %}" class="btn btn-outline-secondary px-4 ms-2">Cancel</a>
  </form>
</div>
{% endblock %}
