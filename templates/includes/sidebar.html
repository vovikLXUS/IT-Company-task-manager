<a href="{% url 'tasks:index' %}" class="sidebar-brand">
  <i class="bi bi-kanban-fill"></i>
  <span>TaskFlow</span>
</a>

{% if user.is_authenticated %}
  <div class="sidebar-user-card mb-3">
    <div class="d-flex align-items-center gap-2">
      <div class="sidebar-user-avatar">
        {{ user.username|first|upper }}
      </div>
      <div class="overflow-hidden">
        <a href="{{ user.get_absolute_url }}" class="text-white text-decoration-none fw-semibold small d-block text-truncate">
          {{ user.username }}
        </a>
        <span class="text-secondary small d-block">
          {% if user.position %}{{ user.position.name }}{% else %}Worker{% endif %}
        </span>
      </div>
    </div>
    <form method="post" action="{% url 'logout' %}" class="mt-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-sm btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-1 py-1">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </form>
  </div>
{% else %}
  <div class="mb-3">
    <a href="{% url 'login' %}?next={{ request.path }}" class="btn btn-sm btn-primary w-100 d-flex align-items-center justify-content-center gap-1">
      <i class="bi bi-box-arrow-in-right"></i> Login
    </a>
  </div>
{% endif %}

<ul class="sidebar-nav list-group">
  <li class="list-group-item">
    <a href="{% url 'tasks:index' %}" class="{% if request.resolver_match.url_name == 'index' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i> Home
    </a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'tasks:worker-list' %}" class="{% if 'worker' in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-people"></i> All workers
    </a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'tasks:task-list' %}" class="{% if 'task' in request.resolver_match.url_name and 'task-type' not in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-check2-square"></i> All tasks
    </a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'tasks:position-list' %}" class="{% if 'position' in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-person-badge"></i> All positions
    </a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'tasks:task-type-list' %}" class="{% if 'task-type' in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-tags"></i> All task types
    </a>
  </li>
</ul>
